<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Vishnupurikar Xerox &amp; Seva Kendra">
  <!-- 2D Circular Monogram Emblem -->
  <g id="emblem">
    <!-- Outer Deep Burgundy Circle -->
    <circle cx="32" cy="32" r="29" fill="#581c2f"/>
    <!-- Subtle Outer Border -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="#e8b4b8" stroke-width="1"/>
    <!-- Inner Gold Ring -->
    <circle cx="32" cy="32" r="24.5" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Subtle Inner Accent Ring -->
    <circle cx="32" cy="32" r="21.5" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
    <!-- Central Serif Letter 'V' -->
    <text x="32" y="42.5" text-anchor="middle" font-family="'Playfair Display', 'Times New Roman', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">V</text>
  </g>

  <!-- 2D Typography Wordmark -->
  <g id="wordmark">
    <!-- Brand Name -->
    <text x="74" y="33" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#431c28" letter-spacing="0.3px">Vishnupurikar</text>
    
    <!-- Accent Divider Line with Central Diamond -->
    <line x1="74" y1="41" x2="312" y2="41" stroke="#b86b7e" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="193,39 196,41 193,43 190,41" fill="#d4af37"/>

    <!-- Subtitle Text -->
    <text x="75" y="54" font-family="'DM Sans', 'Noto Sans Devanagari', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#6f2638" letter-spacing="3.2px">XEROX &amp; SEVA KENDRA</text>
  </g>
</svg>
